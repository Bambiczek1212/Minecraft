function bind(){cvs.addEventListener('pointerdown',e=>{cvs.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;if(pts.size===2)pd=d2()});

  if(pts.size===2){const d=d2();O.d=Math.min(400,Math.max(25,O.d*pd/d));pd=d}
  else if(mv&&sel){rc.setFromCamera(ndc(e),camera);const v=new THREE.Vector3();if(rc.ray.intersectPlane(PL,v)){sel.ax=Math.max(-250,Math.min(250,v.x));sel.az=Math.max(-250,Math.min(250,v.z))}}
  else{O.a-=dx*.01;O.p=Math.min(1.52,Math.max(.15,O.p-dy*.01))}});
 cvs.addEventListener('pointerup',e=>{if(pts.has(e.pointerId)){if(moved<6&&pts.size===1&&tool!=='sel'){blockTap(e)}else if(moved<6&&pts.size===1){rc.setFromCamera(ndc(e),camera);const h=rc.intersectObjects(objs.map(o=>o.g),true);if(h.length){sel=h[0].object.userData.o;if(tab==='p'||tab==='t')panel()}}pts.delete(e.pointerId)}});
 cvs.addEventListener('pointercancel',e=>pts.delete(e.pointerId));
 cvs.addEventListener('wheel',e=>{e.preventDefault();O.d=Math.min(400,Math.max(25,O.d*(1+e.deltaY*.001)))},{passive:false});
 addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();TL.play=!TL.play;if(TL.play)TL.on=true}if(e.key==='Delete')del()});
 addEventListener('resize',()=>{ren.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()})}
function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.1);T+=dt*speed;if(TL.play){TL.t+=dt*speed;if(TL.t>=TL.dur){if(TL.loop)TL.t%=TL.dur;else{TL.t=TL.dur;TL.play=false;if(recAuto&&rec)rec.stop()}}updTL()}
 if(auto){hour=(hour+dt*speed*.6)%24;if(hsEl)hsEl.value=hour;sky()}
 objs.forEach(o=>{animate(o,T+o.ph);o.sh.position.set(o.g.position.x,.1,o.g.position.z)});
 ring.visible=!!sel;if(sel)ring.position.set(sel.ax,.2,sel.az);
 clouds.forEach(c=>{c.position.x+=dt*4;if(c.position.x>450)c.position.x=-450});
 camera.position.set(TG.x+O.d*Math.sin(O.p)*Math.sin(O.a),TG.y+O.d*Math.cos(O.p),TG.z+O.d*Math.sin(O.p)*Math.cos(O.a));camera.lookAt(TG);
 sunM.lookAt(camera.position);moonM.lookAt(camera.position);ren.render(scene,camera)}

const steps=[initScene,initWorld,initSky,initChars,()=>{bind();panel()}];let si=0;
(function nx(){prog(Math.round(si/steps.length*100));if(si<steps.length){steps[si++]();setTimeout(nx,380)}else{prog(100);setTimeout(()=>{$('#ld').style.opacity=0;setTimeout(()=>$('#ld').remove(),700);frame()},450)}})();
</script></body></html>
